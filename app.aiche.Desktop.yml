app-id: app.aiche.Desktop
base: com.riverbankcomputing.PyQt.BaseApp
base-version: '6.10'
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: aiche-desktop
separate-locales: false

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    directory: lib/ffmpeg
    version: '24.08'
    add-ld-path: lib
    no-autodownload: false
    autodelete: false

finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=all          # /dev/uinput required for Smart Insert (ydotool)
  - --filesystem=home
  - --socket=session-bus
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher
  - --talk-name=org.gnome.Shell.Extensions
  - --env=AICHE_FLATPAK=1
  - --env=PYTHONPATH=/app/lib/aiche-desktop

modules:
  # ── ydotool v1.0.4 ──────────────────────────────────────────────────────────
  - name: ydotool
    buildsystem: simple
    sources:
      - type: file
        url: https://github.com/ReimuNotMoe/ydotool/releases/download/v1.0.4/ydotool-release-ubuntu-latest
        dest-filename: ydotool
        sha256: daa83507a596d6839b7467540382dbdc6e4bf64ebfa4f7d6416e877d9a522c0c
      - type: file
        url: https://github.com/ReimuNotMoe/ydotool/releases/download/v1.0.4/ydotoold-release-ubuntu-latest
        dest-filename: ydotoold
        sha256: 3f14f96308935214c0fb154507360f7632e7deda1935dc2d538259fd9986ed36
    build-commands:
      - install -Dm755 ydotool /app/bin/ydotool
      - install -Dm755 ydotoold /app/bin/ydotoold

  # ── wl-clipboard (wl-copy for Wayland clipboard — not in KDE runtime) ───────
  - name: wl-clipboard
    buildsystem: simple
    sources:
      - type: dir
        path: bins
        skip-arches: []
    build-commands:
      - install -Dm755 wl-copy /app/bin/wl-copy

  # ── ffmpeg extension mount-point (org.freedesktop.Platform.ffmpeg-full) ──────
  - name: ffmpeg-dir
    buildsystem: simple
    build-commands:
      - mkdir -p /app/lib/ffmpeg

  # ── Python dependencies (offline — generated by flatpak-pip-generator) ───────
  - !include python3-deps.yaml

  # ── AICHE Desktop application ────────────────────────────────────────────────
  - name: aiche-desktop
    buildsystem: simple
    sources:
      - type: dir
        path: ..
        skip: ['.git', 'build-flatpak', 'AppDir', '*.snap', '*.AppImage', 'flatpak/bins', 'flatpak/libs']
    build-commands:
      # Install application source
      - install -dm755 /app/lib/aiche-desktop
      - cp -r src /app/lib/aiche-desktop/
      - cp -r resources /app/lib/aiche-desktop/

      # Install launcher wrapper
      - install -Dm755 flatpak/aiche-wrapper.sh /app/bin/aiche-desktop

      # Desktop entry
      - install -Dm644 aiche-desktop.desktop /app/share/applications/app.aiche.Desktop.desktop
      - desktop-file-edit --set-key=Exec --set-value="aiche-desktop %u" /app/share/applications/app.aiche.Desktop.desktop
      - desktop-file-edit --set-key=Icon --set-value="app.aiche.Desktop" /app/share/applications/app.aiche.Desktop.desktop

      # Icons
      - install -Dm644 flatpak/icons/512.png /app/share/icons/hicolor/512x512/apps/app.aiche.Desktop.png
      - install -Dm644 flatpak/icons/256.png /app/share/icons/hicolor/256x256/apps/app.aiche.Desktop.png
      - install -Dm644 flatpak/icons/128.png /app/share/icons/hicolor/128x128/apps/app.aiche.Desktop.png
      - install -Dm644 flatpak/icons/64.png /app/share/icons/hicolor/64x64/apps/app.aiche.Desktop.png

      # AppStream metadata
      - install -Dm644 flatpak/app.aiche.Desktop.appdata.xml /app/share/metainfo/app.aiche.Desktop.appdata.xml
